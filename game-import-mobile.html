    function importGames() {
      try {
        const existing = localStorage.getItem('gaming_log_v1');
        if (existing) {
          localStorage.setItem('gaming_log_v1_backup_' + Date.now(), existing);
        }
        localStorage.setItem('gaming_log_v1', JSON.stringify(importData));
        const box = document.getElementById('ok');
        box.style.display = 'block';
        box.textContent = '가져오기 완료\n총 ' + importData.length + '개 기록이 저장됐어.\n이제 앱으로 돌아가서 확인하면 돼.';
