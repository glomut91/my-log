<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f7ff">
  <meta charset="UTF-8" />
  <title>My Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --primary: #4f8df5;
      --primary-soft: #e9f1ff;
      --primary-strong: #2b63d6;
      --border: #d6e1f7;
      --bg: #f4f7ff;
      --text-main: #111111;
      --text-muted: #667085;
      --card: #ffffff;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 980px;
      margin: 20px auto;
      padding: 0 12px 40px;
      background: var(--bg);
      color: var(--text-main);
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: var(--primary-strong);
    }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .tabs, .subtabs {
      display: flex;
      gap: 8px;
      margin: 10px 0 16px;
    }
    .tab-btn, .subtab-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-main);
    }
    .tab-btn.active, .subtab-btn.active {
      font-weight: 400;
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-strong);
      box-shadow: 0 2px 6px rgba(79,141,245,0.15);
    }
    .module, .subsection { display: none; }
    .module.active, .subsection.active { display: block; }
    .info-box, form, .filters, .stats-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      background: var(--card);
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    .info-box { font-size: 0.9rem; color: var(--text-muted); }
    .form-row, .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    .form-group, .filter-group {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
    }
    label {
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79,141,245,0.15);
    }
    textarea { resize: vertical; }
    .btn-row, .filters-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    button { cursor: pointer; }
    .primary, .secondary, .danger, .ghost {
      border-radius: 999px;
      font-size: 0.88rem;
      padding: 8px 14px;
    }
    .primary { border: none; background: var(--primary); color: #fff; }
    .secondary, .ghost { border: 1px solid var(--border); background: #fff; color: var(--primary-strong); }
    .danger { border: 1px solid #fca5a5; background: var(--danger-bg); color: var(--danger); }
    .filters-title, .stats-title { font-weight: 400; margin-bottom: 6px; color: var(--primary-strong); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    th, td {
      border-bottom: 1px solid #eef1f8;
      padding: 7px 6px;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--primary-soft); font-weight: 600; color: var(--primary-strong); }
    tr:nth-child(even) td { background: #fafbff; }
    .small { font-size: 0.76rem; color: var(--text-muted); }
    .center { text-align: center; }
    .tag {
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #e0e6f5;
      font-size: 0.76rem;
      display: inline-block;
      margin-right: 4px;
      background: #f5f7ff;
      color: #4b5563;
    }
    .empty-state {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 12px 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .stat-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f9fbff;
      padding: 10px;
    }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); }
    .stat-value { font-size: 1.1rem; font-weight: 700; color: var(--primary-strong); margin-top: 4px; }
 .record-table {
  width: 100%;
  table-layout: fixed;
}

.record-table th,
.record-table td {
  padding: 8px 6px;
  vertical-align: top;
}

.book-col-date {
  width: 92px;
  white-space: nowrap;
}

.book-col-type {
  width: 68px;
  white-space: nowrap;
}

.book-col-memo {
  width: 48px;
  white-space: nowrap;
}

.book-col-title {
  width: calc(100% - 208px);
  white-space: normal;
  word-break: keep-all;
}

    .book-date-line { display: block; white-space: nowrap; }
    .book-date-line.sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

    .memo-btn {
      width: 32px;
      height: 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      line-height: 1;
      padding: 0;
    }
    .memo-btn.has-memo {
      border-width: 2px;
      border-color: var(--primary-strong);
      background: var(--primary-soft);
    }
    .memo-btn.no-memo {
      color: var(--text-muted);
      background: #fff;
    }
    #book-memo-overlay,
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.45);
      display: none !important;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 2000;
    }
    #book-memo-overlay.active,
    .overlay.active {
      display: flex !important;
    }
    .modal-card {
      width: min(100%, 680px);
      max-height: min(88vh, 900px);
      overflow: auto;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      box-shadow: 0 20px 50px rgba(15,23,42,0.18);
      padding: 22px;
    }
    .modal-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }
    .modal-title {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary-strong);
    }
    .modal-header-right {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      justify-content: flex-end;
      flex-shrink: 0;
    }
    .memo-inline-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }
    .memo-icon-btn {
      min-width: 58px;
      height: 38px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--primary-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      font-size: 0.9rem;
      font-weight: 400;
      line-height: 1;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }
    .memo-icon-btn:hover {
      background: #f9fbff;
      border-color: #c4d4f6;
    }
    .memo-icon-btn:active {
      transform: scale(0.97);
    }
    .memo-icon-btn:disabled,
    .memo-icon-btn.is-disabled {
      opacity: 0.4;
      pointer-events: none;
    }
    .memo-cards {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
    }
    .memo-card {
      width: min(100%, 560px);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      background: #f9fbff;
      cursor: pointer;
      white-space: pre-wrap;
      word-break: keep-all;
      line-height: 1.6;
      text-align: left;
    }
    .memo-card.active {
      border-width: 2px;
      border-color: var(--primary-strong);
      background: var(--primary-soft);
      box-shadow: 0 4px 14px rgba(79,141,245,0.14);
    }
    .memo-selected-actions {
      width: min(100%, 560px);
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: -2px;
      margin-bottom: 4px;
    }
    .memo-editor {
      width: 100%;
      min-height: 360px;
      resize: vertical;
    }
    #book-memo-list-screen,
    #book-memo-edit-screen {
      min-height: 320px;
    }
    #book-memo-edit-screen .memo-editor {
      min-height: min(52vh, 520px);
    }
    .memo-order-btn {
      min-width: 62px;
      height: 36px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: #fff;
      color: var(--primary-strong);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 12px;
      font-size: 0.86rem;
      font-weight: 400;
      line-height: 1;
      box-shadow: 0 1px 2px rgba(15,23,42,0.04);
      transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
      white-space: nowrap;
    }
    .memo-order-btn:hover {
      background: #f9fbff;
      border-color: #c4d4f6;
    }
    .memo-order-btn:active {
      transform: scale(0.97);
    }
    .is-disabled {
      opacity: 0.45;
      pointer-events: none;
    }
    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%) translateY(8px);
      background: rgba(26, 86, 219, 0.96);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(15,23,42,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10000;
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    #toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 640px) {
      body { margin-top: 10px; }
      h1 { font-size: 1.5rem; }
      .tabs, .subtabs { gap: 6px; }
      .tab-btn, .subtab-btn { font-size: 0.88rem; padding: 8px 6px; }
      table, thead, tbody, th, td, tr { font-size: 0.78rem; }
      .modal-header {
        align-items: flex-start;
      }
      .modal-title {
        font-size: 0.98rem;
      }
      .memo-icon-btn {
        min-width: 54px;
        height: 36px;
        padding: 0 12px;
      }
      .memo-order-btn {
        min-width: 58px;
        height: 34px;
        padding: 0 10px;
      }
    }
  </style>
</head>
<body>
  <h1>My Log</h1>

  <div id="books-module" class="module active">
    <div class="subtabs">
      <button class="subtab-btn active" data-target="books-input">입력</button>
      <button class="subtab-btn" data-target="books-list">기록</button>
      <button class="subtab-btn" data-target="books-stats">통계</button>
    </div>

    <div id="books-input" class="subsection active">
      <form id="book-form">
        <div class="form-row">
          <div class="form-group"><label for="book-title">제목</label><input type="text" id="book-title" required></div>
          <div class="form-group"><label for="book-author">작가</label><input type="text" id="book-author"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="book-genre">분야</label><input type="text" id="book-genre"></div>
          <div class="form-group"><label for="book-format">형태</label>
            <select id="book-format">
              <option value=""></option>
              <option value="ebook">e북</option>
              <option value="paper">종이책</option>
              <option value="audio">오디오북</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="book-start-date">시작 날짜</label><input type="date" id="book-start-date"></div>
          <div class="form-group"><label for="book-finish-date">종료 날짜</label><input type="date" id="book-finish-date"></div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1 1 100%"><label for="book-memo">메모</label><textarea id="book-memo" rows="4"></textarea></div>
        </div>
        <div class="btn-row">
          <button type="button" class="danger" id="book-delete-btn" style="display:none; margin-right:auto;">삭제</button>
          <button type="button" class="secondary" id="book-reset-btn" style="display:none;">입력 취소</button>
          <button type="submit" class="primary" id="book-submit-btn">추가</button>
        </div>
        <input type="hidden" id="book-edit-index" value="">
      </form>
    </div>

    <div id="books-list" class="subsection">
      <div class="filters">
        <div class="filters-title">필터</div>
        <div class="filters-row">
          <div class="filter-group"><label for="book-filter-title">제목</label><input type="text" id="book-filter-title" placeholder="제목 검색"></div>
          <div class="filter-group"><label for="book-filter-author">작가</label><input type="text" id="book-filter-author" placeholder="작가 검색"></div>
        </div>
        <div class="filters-row">
          <div class="filter-group"><label for="book-filter-year">연도</label><select id="book-filter-year"><option value="">전체</option></select></div>
          <div class="filter-group"><label for="book-filter-genre">분야</label><select id="book-filter-genre"><option value="">전체</option></select></div>
        </div>
        <div class="filters-row">
          <div class="filter-group"><label for="book-filter-format">형태</label>
            <select id="book-filter-format"><option value="">전체</option><option value="ebook">e북</option><option value="paper">종이책</option><option value="audio">오디오북</option></select>
          </div>
          <div class="filter-group"><label for="book-filter-memo">메모</label>
            <select id="book-filter-memo"><option value="">전체</option><option value="with">메모 있음</option><option value="without">메모 없음</option></select>
          </div>
        </div>
        <div class="filters-actions"><button type="button" class="secondary" id="book-filter-reset-btn">필터 초기화</button></div>
      </div>
      <div id="books-empty" class="empty-state">아직 등록된 책이 없습니다.</div>
      <table id="book-table" class="record-table" style="display:none;">
        <thead><tr><th class="book-col-title">도서</th><th class="book-col-date">읽은 날짜</th><th class="center book-col-type">형태</th><th class="center book-col-memo">메모</th></tr></thead>
        <tbody id="book-tbody"></tbody>
      </table>
      <div class="small" id="book-list-summary"></div>
    </div>

    <div id="books-stats" class="subsection">
      <div class="stats-grid" id="book-stats-grid"></div>
      <div class="stats-block">
        <div class="stats-title">연도별 통계</div>
        <table id="book-year-table" style="display:none;"><thead><tr><th>연도</th><th class="center">읽은 책</th></tr></thead><tbody id="book-year-tbody"></tbody></table>
        <div id="book-year-empty" class="small">연도별 통계를 계산할 데이터가 없습니다.</div>
      </div>
      <div class="stats-block">
        <div class="stats-title">월별 통계</div>
        <table id="book-month-table" style="display:none;"><thead><tr><th>연-월</th><th class="center">읽은 책</th></tr></thead><tbody id="book-month-tbody"></tbody></table>
        <div id="book-month-empty" class="small">월별 통계를 계산할 데이터가 없습니다.</div>
      </div>
    </div>
  </div>

  <div id="book-memo-overlay" class="overlay">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title">도서 메모</div>
        <div class="modal-header-right">
          <div class="memo-inline-actions">
            <button type="button" class="memo-icon-btn" id="book-memo-edit-btn" title="수정" aria-label="수정">수정</button>
            <button type="button" class="memo-icon-btn" id="book-memo-new-btn" title="새 메모" aria-label="새 메모">새 메모</button>
          </div>
          <button type="button" class="memo-icon-btn" id="book-memo-close-btn" title="닫기" aria-label="닫기">닫기</button>
        </div>
      </div>
      <div class="small" id="book-memo-book-info" style="margin-bottom:8px;"></div>

      <div id="book-memo-list-screen">
        <div class="memo-cards" id="book-memo-cards"></div>
      </div>

      <div id="book-memo-edit-screen" style="display:none;">
        <textarea id="book-memo-editor" class="memo-editor" placeholder="메모를 입력"></textarea>
        <div class="modal-actions">
          <button type="button" class="danger" id="book-memo-delete-btn">삭제</button>
          <button type="button" class="secondary" id="book-memo-cancel-btn">뒤로</button>
          <button type="button" class="primary" id="book-memo-save-btn">저장</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const BOOKS_KEY = 'reading_log_v1';

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('toast-show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('toast-show'), 2200);
    }
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    function loadData(key) {
      const raw = localStorage.getItem(key);
      if (!raw) return [];
      try {
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function formatBookType(v) {
      return ({ ebook: 'e북', paper: '종이책', audio: '오디오북' })[v] || '-';
    }
    function calcDays(startDate, finishDate) {
      if (!startDate || !finishDate) return null;
      const s = new Date(startDate);
      const f = new Date(finishDate);
      if (isNaN(s.getTime()) || isNaN(f.getTime())) return null;
      const diff = Math.round((f.getTime() - s.getTime()) / 86400000) + 1;
      return diff > 0 ? diff : null;
    }

    function ensureBookMemos(book) {
      if (!Array.isArray(book.memos)) book.memos = [];
      if (!book.memos.length && book.memo && String(book.memo).trim()) {
        book.memos = String(book.memo).split(/\n\n+/).map(v => v.trim()).filter(Boolean);
      }
      return book.memos;
    }
    function syncBookMemoText(book) {
      const memos = ensureBookMemos(book);
      book.memo = memos.join('\n\n');
      return book;
    }

    document.querySelectorAll('.subtabs').forEach(group => {
      const buttons = group.querySelectorAll('.subtab-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const module = btn.closest('.module');
          module.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
          module.querySelectorAll('.subsection').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          module.querySelector('#' + btn.dataset.target).classList.add('active');
          if (btn.dataset.target === 'books-list') renderBooksList();
          if (btn.dataset.target === 'books-stats') renderBooksStats();
        });
      });
    });

    const bookForm = document.getElementById('book-form');
    const bookTitle = document.getElementById('book-title');
    const bookAuthor = document.getElementById('book-author');
    const bookGenre = document.getElementById('book-genre');
    const bookFormat = document.getElementById('book-format');
    const bookStart = document.getElementById('book-start-date');
    const bookFinish = document.getElementById('book-finish-date');
    const bookMemo = document.getElementById('book-memo');
    const bookEditIndex = document.getElementById('book-edit-index');
    const bookSubmitBtn = document.getElementById('book-submit-btn');
    const bookResetBtn = document.getElementById('book-reset-btn');
    const bookDeleteBtn = document.getElementById('book-delete-btn');

    const bookMemoOverlay = document.getElementById('book-memo-overlay');
    const bookMemoBookInfo = document.getElementById('book-memo-book-info');
    const bookMemoCards = document.getElementById('book-memo-cards');
    const bookMemoListScreen = document.getElementById('book-memo-list-screen');
    const bookMemoEditScreen = document.getElementById('book-memo-edit-screen');
    const bookMemoEditor = document.getElementById('book-memo-editor');
    const bookMemoSaveBtn = document.getElementById('book-memo-save-btn');
    const bookMemoDeleteBtn = document.getElementById('book-memo-delete-btn');
    const bookMemoEditBtn = document.getElementById('book-memo-edit-btn');
    const bookMemoNewBtn = document.getElementById('book-memo-new-btn');
    const bookMemoCancelBtn = document.getElementById('book-memo-cancel-btn');
    const bookMemoCloseBtn = document.getElementById('book-memo-close-btn');
    let activeBookMemoBookIndex = null;
    let activeBookMemoEditIndex = null;
    let activeBookMemoSelectedIndex = null;

    function clearBookForm() {
      bookForm.reset();
      bookEditIndex.value = '';
      bookSubmitBtn.textContent = '추가';
      bookResetBtn.style.display = 'none';
      bookDeleteBtn.style.display = 'none';
      bookFormat.value = '';
    }
    bookResetBtn.addEventListener('click', clearBookForm);
    bookDeleteBtn.addEventListener('click', () => {
      const idx = Number(bookEditIndex.value);
      if (!Number.isInteger(idx)) return;
      if (!confirm('이 독서 기록을 삭제할까?')) return;
      const books = loadData(BOOKS_KEY);
      books.splice(idx, 1);
      saveData(BOOKS_KEY, books);
      clearBookForm();
      renderBooksList();
      renderBooksStats();
      showToast('독서 기록이 삭제되었다.');
    });
    bookForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = bookTitle.value.trim();
      if (!title) return showToast('제목은 필수 항목이다.');
      const books = loadData(BOOKS_KEY);
      const item = {
        title,
        author: bookAuthor.value.trim(),
        genre: bookGenre.value.trim(),
        format: bookFormat.value || '',
        startDate: bookStart.value || '',
        finishDate: bookFinish.value || '',
        memo: bookMemo.value || ''
      };
      const edit = bookEditIndex.value;
      if (edit !== '') {
        const old = books[Number(edit)] || {};
        if (old.memos) item.memos = old.memos;
        books[Number(edit)] = { ...old, ...item };
        showToast('독서 기록이 수정되었다.');
      } else {
        if (item.memo && item.memo.trim()) item.memos = [item.memo.trim()];
        books.push(item);
        showToast('독서 기록이 추가되었다.');
      }
      saveData(BOOKS_KEY, books);
      clearBookForm();
      renderBooksList();
      renderBooksStats();
    });
    function startBookEdit(index) {
      const books = loadData(BOOKS_KEY);
      const item = books[index];
      if (!item) return;
      document.querySelector('#books-module .subtab-btn[data-target="books-input"]').click();
      bookTitle.value = item.title || '';
      bookAuthor.value = item.author || '';
      bookGenre.value = item.genre || '';
      bookFormat.value = item.format || '';
      bookStart.value = item.startDate || '';
      bookFinish.value = item.finishDate || '';
      bookMemo.value = item.memo || '';
      bookEditIndex.value = String(index);
      bookSubmitBtn.textContent = '수정 저장';
      bookResetBtn.style.display = 'inline-block';
      bookDeleteBtn.style.display = 'inline-block';
    }


    function updateBookMemoListActionButtons() {
      const books = loadData(BOOKS_KEY);
      const book = books[activeBookMemoBookIndex];
      const memos = book ? ensureBookMemos(book) : [];
      const hasSelection = activeBookMemoSelectedIndex !== null && activeBookMemoSelectedIndex >= 0 && activeBookMemoSelectedIndex < memos.length;

      [bookMemoEditBtn].forEach(btn => {
        btn.disabled = !hasSelection;
        btn.classList.toggle('is-disabled', !hasSelection);
      });
    }
    function showBookMemoListScreen() {
      bookMemoListScreen.style.display = '';
      bookMemoEditScreen.style.display = 'none';
      bookMemoEditor.value = '';
      renderBookMemoCards();
      updateBookMemoListActionButtons();
    }
    function showBookMemoEditScreen(editIndex = null) {
      const books = loadData(BOOKS_KEY);
      const book = books[activeBookMemoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      activeBookMemoEditIndex = editIndex;
      bookMemoEditor.value = editIndex === null ? '' : (memos[editIndex] || '');
      bookMemoListScreen.style.display = 'none';
      bookMemoEditScreen.style.display = '';
      bookMemoDeleteBtn.style.display = editIndex === null ? 'none' : 'inline-block';
    }
    function closeBookMemoOverlay() {
      bookMemoOverlay.classList.remove('active');
      activeBookMemoBookIndex = null;
      activeBookMemoEditIndex = null;
      activeBookMemoSelectedIndex = null;
      bookMemoEditor.value = '';
      bookMemoListScreen.style.display = '';
      bookMemoEditScreen.style.display = 'none';
    }

    function moveBookMemoTo(targetIndex) {
      if (activeBookMemoBookIndex === null || activeBookMemoSelectedIndex === null) return;
      const books = loadData(BOOKS_KEY);
      const book = books[activeBookMemoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      const fromIndex = activeBookMemoSelectedIndex;
      if (fromIndex < 0 || fromIndex >= memos.length) return;
      if (targetIndex < 0) targetIndex = 0;
      if (targetIndex > memos.length - 1) targetIndex = memos.length - 1;
      if (fromIndex === targetIndex) return;
      const [moved] = memos.splice(fromIndex, 1);
      memos.splice(targetIndex, 0, moved);
      syncBookMemoText(book);
      books[activeBookMemoBookIndex] = book;
      saveData(BOOKS_KEY, books);
      activeBookMemoSelectedIndex = targetIndex;
      renderBookMemoCards();
      updateBookMemoListActionButtons();
      renderBooksList();
      showToast('메모 순서를 변경했다.');
    }
    function renderBookMemoCards() {
      const books = loadData(BOOKS_KEY);
      const book = books[activeBookMemoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      bookMemoCards.innerHTML = '';
      if (!memos.length) {
        activeBookMemoSelectedIndex = null;
        bookMemoCards.innerHTML = '<div class="small">저장된 메모가 없습니다.</div>';
        updateBookMemoListActionButtons();
        return;
      }
      if (activeBookMemoSelectedIndex === null || activeBookMemoSelectedIndex >= memos.length) {
        activeBookMemoSelectedIndex = 0;
      }
      memos.forEach((memo, idx) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'memo-card' + (idx === activeBookMemoSelectedIndex ? ' active' : '');
        btn.textContent = memo;
        btn.addEventListener('click', () => {
          activeBookMemoSelectedIndex = idx;
          renderBookMemoCards();
          updateBookMemoListActionButtons();
        });
        bookMemoCards.appendChild(btn);

        if (idx === activeBookMemoSelectedIndex) {
          const actions = document.createElement('div');
          actions.className = 'memo-selected-actions';

          const makeBtn = (text, disabled, onClick) => {
            const el = document.createElement('button');
            el.type = 'button';
            el.className = 'memo-order-btn' + (disabled ? ' is-disabled' : '');
            el.textContent = text;
            el.title = text;
            el.setAttribute('aria-label', text);
            el.disabled = disabled;
            el.addEventListener('click', onClick);
            return el;
          };

          actions.appendChild(makeBtn('맨 위', idx == 0, () => moveBookMemoTo(0)));
          actions.appendChild(makeBtn('위로', idx == 0, () => moveBookMemoTo(activeBookMemoSelectedIndex - 1)));
          actions.appendChild(makeBtn('아래로', idx === memos.length - 1, () => moveBookMemoTo(activeBookMemoSelectedIndex + 1)));
          actions.appendChild(makeBtn('맨 아래', idx === memos.length - 1, () => moveBookMemoTo(memos.length - 1)));

          bookMemoCards.appendChild(actions);
        }
      });
      updateBookMemoListActionButtons();
    }
    function openBookMemoOverlay(index) {
      const books = loadData(BOOKS_KEY);
      const book = books[index];
      if (!book) return;
      activeBookMemoBookIndex = index;
      activeBookMemoEditIndex = null;
      syncBookMemoText(book);
      books[index] = book;
      saveData(BOOKS_KEY, books);
      bookMemoBookInfo.textContent = `${book.title || ''}${book.author ? ' · ' + book.author : ''}`;
      activeBookMemoSelectedIndex = ensureBookMemos(book).length ? 0 : null;
      showBookMemoListScreen();
      bookMemoOverlay.classList.add('active');
    }
    function saveBookMemoCard() {
      if (activeBookMemoBookIndex === null) return;
      const value = bookMemoEditor.value.trim();
      if (!value) return showToast('메모를 입력해줘.');
      const books = loadData(BOOKS_KEY);
      const book = books[activeBookMemoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      if (activeBookMemoEditIndex === null) {
        memos.push(value);
        activeBookMemoSelectedIndex = memos.length - 1;
      } else {
        memos[activeBookMemoEditIndex] = value;
        activeBookMemoSelectedIndex = activeBookMemoEditIndex;
      }
      syncBookMemoText(book);
      books[activeBookMemoBookIndex] = book;
      saveData(BOOKS_KEY, books);
      renderBooksList();
      showBookMemoListScreen();
      showToast('도서 메모가 저장되었다.');
    }
    function deleteBookMemoCard(indexToDelete = activeBookMemoEditIndex ?? activeBookMemoSelectedIndex) {
      if (activeBookMemoBookIndex === null || indexToDelete === null) return;
      const books = loadData(BOOKS_KEY);
      const book = books[activeBookMemoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      if (indexToDelete < 0 || indexToDelete >= memos.length) return;
      memos.splice(indexToDelete, 1);
      syncBookMemoText(book);
      books[activeBookMemoBookIndex] = book;
      saveData(BOOKS_KEY, books);
      activeBookMemoEditIndex = null;
      activeBookMemoSelectedIndex = memos.length ? Math.min(indexToDelete, memos.length - 1) : null;
      renderBooksList();
      showBookMemoListScreen();
      showToast('도서 메모가 삭제되었다.');
    }
    bookMemoSaveBtn.addEventListener('click', saveBookMemoCard);
    bookMemoDeleteBtn.addEventListener('click', () => deleteBookMemoCard(activeBookMemoEditIndex));
    bookMemoEditBtn.addEventListener('click', () => {
      if (activeBookMemoSelectedIndex === null) return;
      showBookMemoEditScreen(activeBookMemoSelectedIndex);
    });
    bookMemoNewBtn.addEventListener('click', () => {
      showBookMemoEditScreen(null);
    });
    bookMemoCancelBtn.addEventListener('click', () => {
      showBookMemoListScreen();
    });
    bookMemoCloseBtn.addEventListener('click', closeBookMemoOverlay);
    bookMemoOverlay.addEventListener('click', (e) => { if (e.target === bookMemoOverlay) closeBookMemoOverlay(); });

    const bFilterYear = document.getElementById('book-filter-year');
    const bFilterTitle = document.getElementById('book-filter-title');
    const bFilterAuthor = document.getElementById('book-filter-author');
    const bFilterGenre = document.getElementById('book-filter-genre');
    const bFilterFormat = document.getElementById('book-filter-format');
    const bFilterMemo = document.getElementById('book-filter-memo');
    const bFilterReset = document.getElementById('book-filter-reset-btn');
    const bookTable = document.getElementById('book-table');
    const bookTbody = document.getElementById('book-tbody');
    const booksEmpty = document.getElementById('books-empty');
    const bookListSummary = document.getElementById('book-list-summary');

    [bFilterYear, bFilterGenre, bFilterFormat, bFilterMemo].forEach(el => el.addEventListener('change', renderBooksList));
    [bFilterTitle, bFilterAuthor].forEach(el => el.addEventListener('input', renderBooksList));
    bFilterReset.addEventListener('click', () => {
      bFilterYear.value = '';
      bFilterTitle.value = '';
      bFilterAuthor.value = '';
      bFilterGenre.value = '';
      bFilterFormat.value = '';
      bFilterMemo.value = '';
      renderBooksList();
    });
    function updateBookFilters(books) {
      const years = [...new Set(books.filter(b => b.finishDate).map(b => b.finishDate.slice(0,4)).filter(v => /^\d{4}$/.test(v)))].sort((a,b) => b.localeCompare(a));
      const genres = [...new Set(books.map(b => (b.genre || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      const y = bFilterYear.value, g = bFilterGenre.value;
      bFilterYear.innerHTML = '<option value="">전체</option>';
      years.forEach(v => bFilterYear.insertAdjacentHTML('beforeend', `<option value="${v}">${v}년</option>`));
      if (years.includes(y)) bFilterYear.value = y;
      bFilterGenre.innerHTML = '<option value="">전체</option>';
      genres.forEach(v => bFilterGenre.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
      if (genres.includes(g)) bFilterGenre.value = g;
    }
    function renderBooksList() {
      const books = loadData(BOOKS_KEY);
      updateBookFilters(books);
      if (!books.length) {
        bookTable.style.display = 'none';
        booksEmpty.style.display = 'block';
        booksEmpty.textContent = '아직 등록된 책이 없습니다.';
        bookListSummary.textContent = '';
        return;
      }
      let filtered = books.map((b, i) => ({ ...b, _index: i })).filter(item => {
        if (bFilterYear.value && (!item.finishDate || item.finishDate.slice(0,4) !== bFilterYear.value)) return false;
        if (bFilterTitle.value.trim() && !(item.title || '').toLowerCase().includes(bFilterTitle.value.trim().toLowerCase())) return false;
        if (bFilterAuthor.value.trim() && !(item.author || '').toLowerCase().includes(bFilterAuthor.value.trim().toLowerCase())) return false;
        if (bFilterGenre.value && (item.genre || '') !== bFilterGenre.value) return false;
        if (bFilterFormat.value && (item.format || '') !== bFilterFormat.value) return false;
        const hasMemo = !!(item.memo && item.memo.trim());
        if (bFilterMemo.value === 'with' && !hasMemo) return false;
        if (bFilterMemo.value === 'without' && hasMemo) return false;
        return true;
      });
      if (!filtered.length) {
        bookTable.style.display = 'none';
        booksEmpty.style.display = 'block';
        booksEmpty.textContent = '필터 조건에 맞는 책이 없습니다.';
        bookListSummary.textContent = `총 ${books.length}권 기록됨 (필터 결과 0권)`;
        return;
      }
      filtered.sort((a,b) => {
        const aReading = !a.finishDate && !!a.startDate;
        const bReading = !b.finishDate && !!b.startDate;
        if (aReading !== bReading) return aReading ? -1 : 1;
        return (b.finishDate || b.startDate || '').localeCompare(a.finishDate || a.startDate || '');
      });
      booksEmpty.style.display = 'none';
      bookTable.style.display = 'table';
      bookTbody.innerHTML = '';
      filtered.forEach(item => {
        const tr = document.createElement('tr');
        const days = calcDays(item.startDate, item.finishDate);
        const memos = ensureBookMemos(item);
        const hasMemo = memos.length > 0;
        tr.innerHTML = `
          <td class="book-col-title">
            <div style="cursor:pointer;" title="누르면 수정">${escapeHtml(item.title)}</div>
            ${item.author ? `<div class="small">${escapeHtml(item.author)}</div>` : ''}
            ${item.genre ? `<div class="small"><span class="tag">${escapeHtml(item.genre)}</span></div>` : ''}
          </td>
          <td class="book-col-date">${item.finishDate ? `<span class="book-date-line">${item.finishDate}</span>${days ? `<span class="book-date-line sub">${days}일</span>` : ''}` : item.startDate ? `<span class="book-date-line">${item.startDate}</span><span class="book-date-line sub">읽는 중</span>` : '<span class="small">날짜 없음</span>'}</td>
          <td class="center small book-col-type">${formatBookType(item.format)}</td>
          <td class="center book-col-memo"><button type="button" class="memo-btn ${hasMemo ? 'has-memo' : 'no-memo'}" title="도서 메모">📝</button></td>`;
        tr.children[0].addEventListener('click', () => startBookEdit(item._index));
        tr.querySelector('.memo-btn').addEventListener('click', (e) => {
          e.stopPropagation();
          openBookMemoOverlay(item._index);
        });
        bookTbody.appendChild(tr);
      });
      const finishedCount = books.filter(b => b.finishDate).length;
      bookListSummary.textContent = `총 ${books.length}권 기록됨 (완독 ${finishedCount}권, 필터 결과 ${filtered.length}권)`;
    }
    function renderBooksStats() {
      const books = loadData(BOOKS_KEY);
      const finished = books.filter(b => b.finishDate);
      const grid = document.getElementById('book-stats-grid');
      const currentYear = String(new Date().getFullYear());
      const years = finished.map(b => b.finishDate.slice(0,4)).filter(v => /^\d{4}$/.test(v));
      const thisYearCount = finished.filter(b => b.finishDate && b.finishDate.slice(0,4) === currentYear).length;
      let avgYear = 0;
      let avgMonth = 0;
      if (finished.length) {
        const sortedDates = finished.map(b => new Date(b.finishDate)).filter(d => !isNaN(d.getTime())).sort((a,b) => a - b);
        if (sortedDates.length) {
          const first = sortedDates[0];
          const last = sortedDates[sortedDates.length - 1];
          const yearSpan = Math.max(1, last.getFullYear() - first.getFullYear() + 1);
          const monthSpan = Math.max(1, (last.getFullYear() - first.getFullYear()) * 12 + (last.getMonth() - first.getMonth()) + 1);
          avgYear = finished.length / yearSpan;
          avgMonth = finished.length / monthSpan;
        }
      }
      grid.innerHTML = `
        <div class="stat-card"><div class="stat-label">총 독서량</div><div class="stat-value">${finished.length}권</div></div>
        <div class="stat-card"><div class="stat-label">올해 독서량</div><div class="stat-value">${thisYearCount}권</div></div>
        <div class="stat-card"><div class="stat-label">연 평균 독서량</div><div class="stat-value">${avgYear ? avgYear.toFixed(1) + '권' : '-'}</div></div>
        <div class="stat-card"><div class="stat-label">월 평균 독서량</div><div class="stat-value">${avgMonth ? avgMonth.toFixed(1) + '권' : '-'}</div></div>`;
      const yearStats = {};
      finished.forEach(b => { const y = b.finishDate.slice(0,4); if (/^\d{4}$/.test(y)) yearStats[y] = (yearStats[y] || 0) + 1; });
      const yKeys = Object.keys(yearStats).sort((a,b)=>b.localeCompare(a));
      const bookYearTable = document.getElementById('book-year-table');
      const bookYearTbody = document.getElementById('book-year-tbody');
      const bookYearEmpty = document.getElementById('book-year-empty');
      bookYearTbody.innerHTML = '';
      if (!yKeys.length) { bookYearTable.style.display='none'; bookYearEmpty.style.display='block'; }
      else {
        bookYearTable.style.display='table'; bookYearEmpty.style.display='none';
        yKeys.forEach(y => bookYearTbody.insertAdjacentHTML('beforeend', `<tr><td>${y}년</td><td class="center">${yearStats[y]}권</td></tr>`));
      }
      const monthStats = {};
      finished.forEach(b => { const ym = b.finishDate.slice(0,7); if (/^\d{4}-\d{2}$/.test(ym)) monthStats[ym] = (monthStats[ym] || 0) + 1; });
      const mKeys = Object.keys(monthStats).sort((a,b)=>b.localeCompare(a));
      const bookMonthTable = document.getElementById('book-month-table');
      const bookMonthTbody = document.getElementById('book-month-tbody');
      const bookMonthEmpty = document.getElementById('book-month-empty');
      bookMonthTbody.innerHTML = '';
      if (!mKeys.length) { bookMonthTable.style.display='none'; bookMonthEmpty.style.display='block'; }
      else {
        bookMonthTable.style.display='table'; bookMonthEmpty.style.display='none';
        mKeys.forEach(ym => bookMonthTbody.insertAdjacentHTML('beforeend', `<tr><td>${ym}</td><td class="center">${monthStats[ym]}권</td></tr>`));
      }
    }

    window.addEventListener('load', () => {
      renderBooksList();
      renderBooksStats();
    });
  </script>
</body>
</html>
