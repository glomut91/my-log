<!DOCTYPE html>
<html lang="ko">
<head>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#f4f7ff">
  <meta charset="UTF-8" />
  <title>My Log</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    :root {
      --primary: #4f8df5;
      --primary-soft: #e9f1ff;
      --primary-strong: #2b63d6;
      --border: #d6e1f7;
      --bg: #f4f7ff;
      --text-main: #111111;
      --text-muted: #667085;
      --card: #ffffff;
      --danger: #b91c1c;
      --danger-bg: #fee2e2;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      max-width: 980px;
      margin: 20px auto;
      padding: 0 12px 40px;
      background: var(--bg);
      color: var(--text-main);
    }
    h1 {
      text-align: center;
      font-size: 1.8rem;
      margin-bottom: 6px;
      color: var(--primary-strong);
    }
    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.9rem;
      margin-bottom: 14px;
    }
    .tabs, .subtabs {
      display: flex;
      gap: 8px;
      margin: 10px 0 16px;
    }
    .tab-btn, .subtab-btn {
      flex: 1;
      padding: 9px 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #fff;
      cursor: pointer;
      font-size: 0.95rem;
      color: var(--text-main);
    }
    .tab-btn.active, .subtab-btn.active {
      font-weight: 600;
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary-strong);
      box-shadow: 0 2px 6px rgba(79,141,245,0.15);
    }
    .module, .subsection { display: none; }
    .module.active, .subsection.active { display: block; }
    .info-box, form, .filters, .stats-block {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 14px;
      background: var(--card);
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    .info-box { font-size: 0.9rem; color: var(--text-muted); }
    .form-row, .filters-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 8px;
    }
    .form-group, .filter-group {
      flex: 1;
      min-width: 140px;
      display: flex;
      flex-direction: column;
      font-size: 0.85rem;
    }
    label {
      margin-bottom: 4px;
      color: var(--text-muted);
    }
    input[type="text"], input[type="date"], input[type="number"], select, textarea {
      padding: 7px 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 0.92rem;
      font-family: inherit;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 2px rgba(79,141,245,0.15);
    }
    textarea { resize: vertical; }
    .btn-row, .filters-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      align-items: center;
      margin-top: 6px;
    }
    button { cursor: pointer; }
    .primary, .secondary, .danger, .ghost {
      border-radius: 999px;
      font-size: 0.88rem;
      padding: 8px 14px;
    }
    .primary { border: none; background: var(--primary); color: #fff; }
    .secondary, .ghost { border: 1px solid var(--border); background: #fff; color: var(--primary-strong); }
    .danger { border: 1px solid #fca5a5; background: var(--danger-bg); color: var(--danger); }
    .filters-title, .stats-title { font-weight: 600; margin-bottom: 6px; color: var(--primary-strong); }
    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(15,23,42,0.03);
    }
    th, td {
      border-bottom: 1px solid #eef1f8;
      padding: 7px 6px;
      text-align: left;
      vertical-align: top;
    }
    th { background: var(--primary-soft); font-weight: 600; color: var(--primary-strong); }
    tr:nth-child(even) td { background: #fafbff; }
    .small { font-size: 0.82rem; color: var(--text-muted); }
    .center { text-align: center; }
    .tag {
      padding: 2px 6px;
      border-radius: 999px;
      border: 1px solid #e0e6f5;
      font-size: 0.76rem;
      display: inline-block;
      margin-right: 4px;
      background: #f5f7ff;
      color: #4b5563;
    }
    .empty-state {
      text-align: center;
      font-size: 0.9rem;
      color: var(--text-muted);
      margin: 12px 0;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px;
      margin-bottom: 10px;
    }
    .stat-card {
      border: 1px solid var(--border);
      border-radius: 12px;
      background: #f9fbff;
      padding: 10px;
    }
    .stat-label { font-size: 0.8rem; color: var(--text-muted); }
    .stat-value { font-size: 1.1rem; font-weight: 700; color: var(--primary-strong); margin-top: 4px; }
    .record-table {
      table-layout: fixed;
      width: 100%;
    }
    
    .record-table th,
    .record-table td {
    }
    
    .book-col-date { width: 92px; }
    .book-col-type { width: 68px; }
    .book-col-memo { width: 48px; }
    
    .book-col-title {
      width: calc(100% - 208px);
      white-space: normal;
      word-break: keep-all;
    }
    .book-date-line { display: block; white-space: nowrap; }
    .book-date-line.sub { font-size: 0.76rem; color: var(--text-muted); margin-top: 2px; }

    .memo-btn {
      border: 1px solid var(--border);
      background: #ffffff;
      border-radius: 999px;
      padding: 2px 8px;
      font-size: 0.9rem;
      line-height: 1.2;
      cursor: pointer;
    }
    .memo-btn.has-memo {
      border-color: var(--primary);
      background: var(--primary-soft);
    }
    .memo-btn.no-memo {
      opacity: 0.45;
    }
    .memo-screen {
      position: fixed;
      inset: 0;
      background: var(--bg);
      display: none;
      flex-direction: column;
      z-index: 1200;
    }
    .memo-screen.active { display: flex; }
    .memo-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--primary-soft);
      box-shadow: 0 1px 3px rgba(15,23,42,0.06);
    }
    .memo-header-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--primary-strong);
    }
    .memo-header-btn {
      border: none;
      background: transparent;
      font-size: 1.1rem;
      padding: 4px 6px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .memo-header-btn.primary-text {
      color: var(--primary-strong);
      font-weight: 700;
    }
    .memo-header-actions {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .memo-book-info {
      padding: 8px 14px 6px;
      font-size: 0.85rem;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      background: #ffffff;
    }
    .memo-body {
      flex: 1;
      overflow-y: auto;
      padding: 10px 8px 16px;
    }
    .memo-footer {
      padding: 8px 12px 12px;
      border-top: 1px solid var(--border);
      background: #f0f4ff;
      display: flex;
      justify-content: flex-end;
    }
    .memo-card-full {
      position: relative;
      padding: 14px 12px 30px;
      border-radius: 12px;
      background: #ffffff;
      border: 1px solid #d3defa;
      margin: 12px 16px 26px;
      box-shadow: 0 2px 4px rgba(79,141,245,0.06);
      cursor: pointer;
      overflow: hidden;
    }
    .memo-card-full::before {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      height: 6px;
      border-radius: 12px 12px 0 0;
      background: linear-gradient(to right, #9bb7ff, #4f8df5);
      opacity: 0.85;
    }
    .memo-card-full p {
      margin: 4px 0 0;
      white-space: pre-line;
      max-height: 9.6em;
      overflow: hidden;
      color: #111827;
      font-size: 0.96rem;
      line-height: 1.7;
    }
    .memo-card-actions {
      position: absolute;
      right: 8px;
      bottom: 6px;
      display: flex;
      gap: 4px;
    }
    .memo-move-btn {
      width: 26px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid #c7d4f5;
      background: #f4f7ff;
      font-size: 0.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #4b5563;
      cursor: pointer;
    }
    .memo-move-btn.disabled {
      opacity: 0.35;
      pointer-events: none;
    }
    .memo-empty {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-align: center;
      margin-top: 20px;
    }
    .memo-body-edit {
      padding: 10px 0 16px;
    }
    #memo-edit-text {
      width: 100%;
      border: none;
      border-radius: 0;
      padding: 12px 16px;
      font-size: 0.98rem;
      line-height: 1.7;
      min-height: calc(100vh - 120px);
      resize: none;
      background: #fdfdff;
      box-sizing: border-box;
    }
    #memo-edit-text:focus {
      outline: none;
      box-shadow: none;
      background: #ffffff;
    }

    #toast {
      position: fixed;
      left: 50%;
      bottom: 56px;
      transform: translateX(-50%) translateY(8px);
      background: rgba(26, 86, 219, 0.96);
      color: #ffffff;
      padding: 8px 16px;
      border-radius: 999px;
      font-size: 0.85rem;
      box-shadow: 0 10px 25px rgba(15,23,42,0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      z-index: 10000;
      max-width: 90%;
      text-align: center;
      white-space: nowrap;
      text-overflow: ellipsis;
      overflow: hidden;
    }
    #toast.toast-show { opacity: 1; transform: translateX(-50%) translateY(0); }
    @media (max-width: 640px) {
      body { margin-top: 10px; }
      h1 { font-size: 1.5rem; }
      .tabs, .subtabs { gap: 6px; }
      .tab-btn, .subtab-btn { font-size: 0.88rem; padding: 8px 6px; }
      table, thead, tbody, th, td, tr { font-size: 0.78rem; }
    }
  </style>
</head>
<body>
  <h1>My Log</h1>

  <div class="tabs">
    <button class="tab-btn active" data-module="books-module">독서</button>
    <button class="tab-btn" data-module="games-module">게임</button>
  </div>

  <div id="books-module" class="module active">
    <div class="subtabs">
      <button class="subtab-btn active" data-target="books-input">입력</button>
      <button class="subtab-btn" data-target="books-list">기록</button>
      <button class="subtab-btn" data-target="books-stats">통계</button>
    </div>

    <div id="books-input" class="subsection active">
      <form id="book-form">
        <div class="form-row">
          <div class="form-group"><label for="book-title">제목</label><input type="text" id="book-title" required></div>
          <div class="form-group"><label for="book-author">작가</label><input type="text" id="book-author"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="book-genre">분야</label><input type="text" id="book-genre"></div>
          <div class="form-group"><label for="book-format">형태</label>
            <select id="book-format">
              <option value=""></option>
              <option value="ebook">e북</option>
              <option value="paper">종이책</option>
              <option value="audio">오디오북</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="book-start-date">읽기 시작한 날짜</label><input type="date" id="book-start-date"></div>
          <div class="form-group"><label for="book-finish-date">완독한 날짜</label><input type="date" id="book-finish-date"></div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1 1 100%"><label for="book-memo">메모</label><textarea id="book-memo" rows="4"></textarea></div>
        </div>
        <div class="btn-row">
          <button type="button" class="danger" id="book-delete-btn" style="display:none; margin-right:auto;">삭제</button>
          <button type="button" class="secondary" id="book-reset-btn" style="display:none;">입력 취소</button>
          <button type="submit" class="primary" id="book-submit-btn">추가</button>
        </div>
        <input type="hidden" id="book-edit-index" value="">
      </form>
    </div>

    <div id="books-list" class="subsection">
      <div class="filters">
        <div class="filters-title">필터</div>
        <div class="filters-row">
          <div class="filter-group"><label for="book-filter-title">제목</label><input type="text" id="book-filter-title" placeholder="제목 검색"></div>
          <div class="filter-group"><label for="book-filter-author">작가</label><input type="text" id="book-filter-author" placeholder="작가 검색"></div>
        </div>
        <div class="filters-row">
          <div class="filter-group"><label for="book-filter-year">연도</label><select id="book-filter-year"><option value="">전체</option></select></div>
          <div class="filter-group"><label for="book-filter-genre">분야</label><select id="book-filter-genre"><option value="">전체</option></select></div>
        </div>
        <div class="filters-row">
          <div class="filter-group"><label for="book-filter-format">형태</label>
            <select id="book-filter-format"><option value="">전체</option><option value="ebook">e북</option><option value="paper">종이책</option><option value="audio">오디오북</option></select>
          </div>
          <div class="filter-group"><label for="book-filter-memo">메모</label>
            <select id="book-filter-memo"><option value="">전체</option><option value="with">메모 있음</option><option value="without">메모 없음</option></select>
          </div>
        </div>
        <div class="filters-actions"><button type="button" class="secondary" id="book-filter-reset-btn">필터 초기화</button></div>
      </div>
      <div id="books-empty" class="empty-state">아직 등록된 책이 없습니다.</div>
      <table id="book-table" class="record-table" style="display:none;">
        <thead><tr><th class="book-col-title">도서</th><th class="book-col-date">읽은 날짜</th><th class="center book-col-type">형태</th><th class="center book-col-memo">메모</th></tr></thead>
        <tbody id="book-tbody"></tbody>
      </table>
      <div class="small" id="book-list-summary"></div>
    </div>

    <div id="books-stats" class="subsection">
      <div class="stats-grid" id="book-stats-grid"></div>
      <div class="stats-block">
        <div class="stats-title">연도별 통계</div>
        <table id="book-year-table" style="display:none;"><thead><tr><th>연도</th><th class="center">읽은 책</th></tr></thead><tbody id="book-year-tbody"></tbody></table>
        <div id="book-year-empty" class="small">연도별 통계를 계산할 데이터가 없습니다.</div>
      </div>
      <div class="stats-block">
        <div class="stats-title">월별 통계</div>
        <table id="book-month-table" style="display:none;"><thead><tr><th>연-월</th><th class="center">읽은 책</th></tr></thead><tbody id="book-month-tbody"></tbody></table>
        <div id="book-month-empty" class="small">월별 통계를 계산할 데이터가 없습니다.</div>
      </div>
    </div>
  </div>

  <div id="games-module" class="module">
    <div class="subtabs">
      <button class="subtab-btn active" data-target="games-input">입력</button>
      <button class="subtab-btn" data-target="games-list">기록</button>
      <button class="subtab-btn" data-target="games-stats">통계</button>
    </div>

    <div id="games-input" class="subsection active">
      <form id="game-form">
        <div class="form-row">
          <div class="form-group"><label for="game-title">게임 이름</label><input type="text" id="game-title" required></div>
          <div class="form-group"><label for="game-platform">플랫폼</label>
            <select id="game-platform">
              <option value=""></option>
              <option value="PS">PS</option>
              <option value="Switch">Switch</option>
              <option value="Steam">Steam</option>
              <option value="기타">기타</option>
            </select></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="game-start-date">시작일</label><input type="date" id="game-start-date"></div>
          <div class="form-group"><label for="game-finish-date">종료일</label><input type="date" id="game-finish-date"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label for="game-status">상태</label>
            <select id="game-status">
              <option value=""></option>
              <option value="playing">플레이 중</option>
              <option value="completed">완료</option>
            </select>
          </div>
          <div class="form-group"><label for="game-price">가격</label><input type="number" id="game-price" min="0" step="1"></div>
          <div class="form-group"><label for="game-playtime">플레이 타임(시간)</label><input type="number" id="game-playtime" min="0" step="1"></div>
        </div>
        <div class="form-row">
          <div class="form-group" style="flex:1 1 100%"><label for="game-note">메모</label><textarea id="game-note" rows="4"></textarea></div>
        </div>
        <div class="btn-row">
          <button type="button" class="danger" id="game-delete-btn" style="display:none; margin-right:auto;">삭제</button>
          <button type="button" class="secondary" id="game-reset-btn" style="display:none;">입력 취소</button>
          <button type="submit" class="primary" id="game-submit-btn">추가</button>
        </div>
        <input type="hidden" id="game-edit-index" value="">
      </form>
    </div>

    <div id="games-list" class="subsection">
      <div class="filters">
        <div class="filters-title">필터</div>
        <div class="filters-row">
          <div class="filter-group"><label for="game-filter-title">게임 이름</label><input type="text" id="game-filter-title" placeholder="게임 검색"></div>
          <div class="filter-group"><label for="game-filter-platform">플랫폼</label><select id="game-filter-platform"><option value="">전체</option></select></div>
        </div>
        <div class="filters-row">
          <div class="filter-group"><label for="game-filter-status">상태</label>
            <select id="game-filter-status"><option value="">전체</option><option value="playing">플레이 중</option><option value="completed">완료</option></select>
          </div>
          <div class="filter-group"><label for="game-filter-year">종료 연도</label><select id="game-filter-year"><option value="">전체</option></select></div>
        </div>
        <div class="filters-actions"><button type="button" class="secondary" id="game-filter-reset-btn">필터 초기화</button></div>
      </div>
      <div id="games-empty" class="empty-state">아직 등록된 게임이 없습니다.</div>
      <table id="game-table" style="display:none;">
        <thead><tr><th>게임</th><th>진행</th><th class="center">상태</th><th class="center">가격</th></tr></thead>
        <tbody id="game-tbody"></tbody>
      </table>
      <div class="small" id="game-list-summary"></div>
    </div>

    <div id="games-stats" class="subsection">
      <div class="stats-grid" id="game-stats-grid"></div>
      <div class="stats-block">
        <div class="stats-title">연도별 완료 수</div>
        <table id="game-year-table" style="display:none;"><thead><tr><th>연도</th><th class="center">완료 게임</th></tr></thead><tbody id="game-year-tbody"></tbody></table>
        <div id="game-year-empty" class="small">연도별 통계를 계산할 데이터가 없습니다.</div>
      </div>
      <div class="stats-block">
        <div class="stats-title">플랫폼별 기록 수</div>
        <table id="game-platform-table" style="display:none;"><thead><tr><th>플랫폼</th><th class="center">기록 수</th></tr></thead><tbody id="game-platform-tbody"></tbody></table>
        <div id="game-platform-empty" class="small">플랫폼 통계를 계산할 데이터가 없습니다.</div>
      </div>
    </div>
  </div>


  <div id="memo-screen" class="memo-screen">
    <div class="memo-header">
      <button type="button" class="memo-header-btn" id="memo-close-btn">✕</button>
      <div class="memo-header-title">메모</div>
      <div style="width:30px;"></div>
    </div>
    <div class="memo-book-info" id="memo-book-info"></div>
    <div class="memo-body" id="memo-list-body">
      <div class="memo-empty" id="memo-empty-text">아직 메모가 없습니다. 아래 버튼으로 새 메모를 추가해 보세요.</div>
      <div id="memo-list-container"></div>
    </div>
    <div class="memo-footer">
      <button type="button" class="primary" id="memo-new-btn">새 메모</button>
    </div>
  </div>

  <div id="memo-edit-screen" class="memo-screen">
    <div class="memo-header">
      <button type="button" class="memo-header-btn" id="memo-edit-back-btn">←</button>
      <div class="memo-header-title">메모 편집</div>
      <div class="memo-header-actions">
        <button type="button" class="memo-header-btn" id="memo-edit-delete-btn">🗑️</button>
        <button type="button" class="memo-header-btn primary-text" id="memo-edit-save-btn">✔️</button>
      </div>
    </div>
    <div class="memo-book-info" id="memo-edit-book-info"></div>
    <div class="memo-body memo-body-edit">
      <textarea id="memo-edit-text" placeholder="메모를 입력하세요."></textarea>
    </div>
  </div>

  <div id="toast"></div>

  <script>
    const BOOKS_KEY = 'reading_log_v1';
    const GAMES_KEY = 'gaming_log_v1';

    let toastTimeout;
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('toast-show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('toast-show'), 2200);
    }
    function escapeHtml(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }
    function loadData(key) {
      const raw = localStorage.getItem(key);
      if (!raw) return [];
      try {
        const arr = JSON.parse(raw);
        return Array.isArray(arr) ? arr : [];
      } catch {
        return [];
      }
    }
    function saveData(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }
    function formatBookType(v) {
      return ({ ebook: 'e북', paper: '종이책', audio: '오디오북' })[v] || '-';
    }
    function formatGameStatus(v) {
      return ({ playing: '플레이 중', completed: '완료', hold: '보류' })[v] || '-';
    }
    function formatPrice(n) {
      const num = Number(n || 0);
      return num ? num.toLocaleString('ko-KR') + '원' : '-';
    }
    function calcDays(startDate, finishDate) {
      if (!startDate || !finishDate) return null;
      const s = new Date(startDate);
      const f = new Date(finishDate);
      if (isNaN(s.getTime()) || isNaN(f.getTime())) return null;
      const diff = Math.round((f.getTime() - s.getTime()) / 86400000) + 1;
      return diff > 0 ? diff : null;
    }

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const target = btn.dataset.module;
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.module').forEach(m => m.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById(target).classList.add('active');
        if (target === 'books-module') {
          renderBooksList(); renderBooksStats();
        } else {
          renderGamesList(); renderGamesStats();
        }
      });
    });

    document.querySelectorAll('.subtabs').forEach(group => {
      const buttons = group.querySelectorAll('.subtab-btn');
      buttons.forEach(btn => {
        btn.addEventListener('click', () => {
          const module = btn.closest('.module');
          module.querySelectorAll('.subtab-btn').forEach(b => b.classList.remove('active'));
          module.querySelectorAll('.subsection').forEach(s => s.classList.remove('active'));
          btn.classList.add('active');
          module.querySelector('#' + btn.dataset.target).classList.add('active');
          if (module.id === 'books-module') {
            if (btn.dataset.target === 'books-list') renderBooksList();
            if (btn.dataset.target === 'books-stats') renderBooksStats();
          } else {
            if (btn.dataset.target === 'games-list') renderGamesList();
            if (btn.dataset.target === 'games-stats') renderGamesStats();
          }
        });
      });
    });

    const bookForm = document.getElementById('book-form');
    const bookTitle = document.getElementById('book-title');
    const bookAuthor = document.getElementById('book-author');
    const bookGenre = document.getElementById('book-genre');
    const bookFormat = document.getElementById('book-format');
    const bookStart = document.getElementById('book-start-date');
    const bookFinish = document.getElementById('book-finish-date');
    const bookMemo = document.getElementById('book-memo');
    const bookEditIndex = document.getElementById('book-edit-index');
    const bookSubmitBtn = document.getElementById('book-submit-btn');
    const bookResetBtn = document.getElementById('book-reset-btn');
    const bookDeleteBtn = document.getElementById('book-delete-btn');

    const memoScreen = document.getElementById('memo-screen');
    const memoBookInfo = document.getElementById('memo-book-info');
    const memoCloseBtn = document.getElementById('memo-close-btn');
    const memoNewBtn = document.getElementById('memo-new-btn');
    const memoListContainer = document.getElementById('memo-list-container');
    const memoEmptyText = document.getElementById('memo-empty-text');

    const memoEditScreen = document.getElementById('memo-edit-screen');
    const memoEditBackBtn = document.getElementById('memo-edit-back-btn');
    const memoEditSaveBtn = document.getElementById('memo-edit-save-btn');
    const memoEditDeleteBtn = document.getElementById('memo-edit-delete-btn');
    const memoEditText = document.getElementById('memo-edit-text');
    const memoEditBookInfo = document.getElementById('memo-edit-book-info');

    let memoBookIndex = null;
    let memoCardIndex = null;

    function ensureBookMemos(book) {
      if (!book.memos) book.memos = [];
      if (!Array.isArray(book.memos)) book.memos = [];
      if (book.memos.length === 0 && book.memo && book.memo.trim()) {
        book.memos.push(book.memo.trim());
      }
      return book.memos;
    }
    function saveMemoBook(bookIndex, memos) {
      const books = loadData(BOOKS_KEY);
      const book = books[bookIndex];
      if (!book) return;
      book.memos = memos.filter(v => v && v.trim()).map(v => v.trim());
      book.memo = book.memos.length ? book.memos.join('\n\n') : '';
      books[bookIndex] = book;
      saveData(BOOKS_KEY, books);
    }
    function closeMemoScreens() {
      memoScreen.classList.remove('active');
      memoEditScreen.classList.remove('active');
      memoBookIndex = null;
      memoCardIndex = null;
    }
    function openMemoListScreen(bookIndex) {
      const books = loadData(BOOKS_KEY);
      const book = books[bookIndex];
      if (!book) return;
      memoBookIndex = bookIndex;
      const memos = ensureBookMemos(book);
      book.memo = memos.join('\n\n');
      books[bookIndex] = book;
      saveData(BOOKS_KEY, books);
      memoBookInfo.textContent = `${book.title}${book.author ? ' · ' + book.author : ''}`;
      renderMemoListFull(memos);
      memoEditScreen.classList.remove('active');
      memoScreen.classList.add('active');
    }
    function renderMemoListFull(memos) {
      memoListContainer.innerHTML = '';
      if (!memos || memos.length === 0) {
        memoEmptyText.style.display = 'block';
        return;
      }
      memoEmptyText.style.display = 'none';
      memos.forEach((text, idx) => {
        const card = document.createElement('div');
        card.className = 'memo-card-full';
        const p = document.createElement('p');
        p.textContent = text || '';
        card.appendChild(p);
        card.addEventListener('click', (e) => {
          if (e.target.closest('.memo-move-btn')) return;
          openMemoEditScreen(idx);
        });
        const actions = document.createElement('div');
        actions.className = 'memo-card-actions';
        const upBtn = document.createElement('button');
        upBtn.type = 'button';
        upBtn.className = 'memo-move-btn' + (idx === 0 ? ' disabled' : '');
        upBtn.textContent = '↑';
        upBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          moveMemo(idx, idx - 1);
        });
        const downBtn = document.createElement('button');
        downBtn.type = 'button';
        downBtn.className = 'memo-move-btn' + (idx === memos.length - 1 ? ' disabled' : '');
        downBtn.textContent = '↓';
        downBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          moveMemo(idx, idx + 1);
        });
        actions.appendChild(upBtn);
        actions.appendChild(downBtn);
        card.appendChild(actions);
        memoListContainer.appendChild(card);
      });
    }
    function openMemoEditScreen(cardIndex) {
      const books = loadData(BOOKS_KEY);
      const book = books[memoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      memoCardIndex = cardIndex;
      memoEditBookInfo.textContent = `${book.title}${book.author ? ' · ' + book.author : ''}`;
      memoEditText.value = memos[cardIndex] || '';
      memoScreen.classList.remove('active');
      memoEditScreen.classList.add('active');
      setTimeout(() => memoEditText.focus(), 0);
    }
    function moveMemo(fromIndex, toIndex) {
      if (memoBookIndex == null) return;
      const books = loadData(BOOKS_KEY);
      const book = books[memoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      if (toIndex < 0 || toIndex >= memos.length) return;
      const [moved] = memos.splice(fromIndex, 1);
      memos.splice(toIndex, 0, moved);
      saveMemoBook(memoBookIndex, memos);
      renderMemoListFull(memos);
      showToast('메모 순서가 변경되었다.');
      renderBooksList();
    }

    memoCloseBtn.addEventListener('click', closeMemoScreens);
    memoNewBtn.addEventListener('click', () => {
      memoCardIndex = -1;
      const books = loadData(BOOKS_KEY);
      const book = books[memoBookIndex];
      if (!book) return;
      memoEditBookInfo.textContent = `${book.title}${book.author ? ' · ' + book.author : ''}`;
      memoEditText.value = '';
      memoScreen.classList.remove('active');
      memoEditScreen.classList.add('active');
      setTimeout(() => memoEditText.focus(), 0);
    });
    memoEditBackBtn.addEventListener('click', () => {
      if (memoBookIndex == null) return closeMemoScreens();
      const books = loadData(BOOKS_KEY);
      const book = books[memoBookIndex];
      if (!book) return closeMemoScreens();
      memoBookInfo.textContent = `${book.title}${book.author ? ' · ' + book.author : ''}`;
      renderMemoListFull(ensureBookMemos(book));
      memoEditScreen.classList.remove('active');
      memoScreen.classList.add('active');
    });
    memoEditSaveBtn.addEventListener('click', () => {
      if (memoBookIndex == null) return;
      const books = loadData(BOOKS_KEY);
      const book = books[memoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      const text = memoEditText.value.trim();
      if (memoCardIndex === -1) {
        if (!text) return showToast('메모 내용을 입력해줘.');
        memos.push(text);
      } else {
        if (!text) {
          memos.splice(memoCardIndex, 1);
        } else {
          memos[memoCardIndex] = text;
        }
      }
      saveMemoBook(memoBookIndex, memos);
      memoEditScreen.classList.remove('active');
      memoBookInfo.textContent = `${book.title}${book.author ? ' · ' + book.author : ''}`;
      renderMemoListFull(memos);
      memoScreen.classList.add('active');
      renderBooksList();
      showToast('메모가 저장되었다.');
    });
    memoEditDeleteBtn.addEventListener('click', () => {
      if (memoBookIndex == null || memoCardIndex == null || memoCardIndex < 0) return;
      if (!confirm('이 메모를 삭제할까?')) return;
      const books = loadData(BOOKS_KEY);
      const book = books[memoBookIndex];
      if (!book) return;
      const memos = ensureBookMemos(book);
      memos.splice(memoCardIndex, 1);
      saveMemoBook(memoBookIndex, memos);
      memoEditScreen.classList.remove('active');
      memoBookInfo.textContent = `${book.title}${book.author ? ' · ' + book.author : ''}`;
      renderMemoListFull(memos);
      memoScreen.classList.add('active');
      renderBooksList();
      showToast('메모가 삭제되었다.');
    });


    function clearBookForm() {
      bookForm.reset();
      bookEditIndex.value = '';
      bookSubmitBtn.textContent = '추가';
      bookResetBtn.style.display = 'none';
      bookDeleteBtn.style.display = 'none';
      bookFormat.value = '';
    }
    bookResetBtn.addEventListener('click', clearBookForm);
    bookDeleteBtn.addEventListener('click', () => {
      const idx = Number(bookEditIndex.value);
      if (!Number.isInteger(idx)) return;
      if (!confirm('이 독서 기록을 삭제할까?')) return;
      const books = loadData(BOOKS_KEY);
      books.splice(idx, 1);
      saveData(BOOKS_KEY, books);
      clearBookForm();
      renderBooksList();
      renderBooksStats();
      showToast('독서 기록이 삭제되었다.');
    });
    bookForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = bookTitle.value.trim();
      if (!title) return showToast('제목은 필수 항목이다.');
      const books = loadData(BOOKS_KEY);
      const item = {
        title,
        author: bookAuthor.value.trim(),
        genre: bookGenre.value.trim(),
        format: bookFormat.value || '',
        startDate: bookStart.value || '',
        finishDate: bookFinish.value || '',
        memo: bookMemo.value || ''
      };
      const edit = bookEditIndex.value;
      if (edit !== '') {
        const old = books[Number(edit)] || {};
        if (old.memos) item.memos = old.memos;
        books[Number(edit)] = { ...old, ...item };
        showToast('독서 기록이 수정되었다.');
      } else {
        books.push(item);
        showToast('독서 기록이 추가되었다.');
      }
      saveData(BOOKS_KEY, books);
      clearBookForm();
      renderBooksList();
      renderBooksStats();
    });
    function startBookEdit(index) {
      const books = loadData(BOOKS_KEY);
      const item = books[index];
      if (!item) return;
      document.querySelector('.tab-btn[data-module="books-module"]').click();
      document.querySelector('#books-module .subtab-btn[data-target="books-input"]').click();
      bookTitle.value = item.title || '';
      bookAuthor.value = item.author || '';
      bookGenre.value = item.genre || '';
      bookFormat.value = item.format || '';
      bookStart.value = item.startDate || '';
      bookFinish.value = item.finishDate || '';
      bookMemo.value = item.memo || '';
      bookEditIndex.value = String(index);
      bookSubmitBtn.textContent = '수정 저장';
      bookResetBtn.style.display = 'inline-block';
      bookDeleteBtn.style.display = 'inline-block';
    }

    const bFilterYear = document.getElementById('book-filter-year');
    const bFilterTitle = document.getElementById('book-filter-title');
    const bFilterAuthor = document.getElementById('book-filter-author');
    const bFilterGenre = document.getElementById('book-filter-genre');
    const bFilterFormat = document.getElementById('book-filter-format');
    const bFilterMemo = document.getElementById('book-filter-memo');
    const bFilterReset = document.getElementById('book-filter-reset-btn');
    const bookTable = document.getElementById('book-table');
    const bookTbody = document.getElementById('book-tbody');
    const booksEmpty = document.getElementById('books-empty');
    const bookListSummary = document.getElementById('book-list-summary');

    [bFilterYear, bFilterGenre, bFilterFormat, bFilterMemo].forEach(el => el.addEventListener('change', renderBooksList));
    [bFilterTitle, bFilterAuthor].forEach(el => el.addEventListener('input', renderBooksList));
    bFilterReset.addEventListener('click', () => {
      bFilterYear.value = '';
      bFilterTitle.value = '';
      bFilterAuthor.value = '';
      bFilterGenre.value = '';
      bFilterFormat.value = '';
      bFilterMemo.value = '';
      renderBooksList();
    });
    function updateBookFilters(books) {
      const years = [...new Set(books.filter(b => b.finishDate).map(b => b.finishDate.slice(0,4)).filter(v => /^\d{4}$/.test(v)))].sort((a,b) => b.localeCompare(a));
      const genres = [...new Set(books.map(b => (b.genre || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      const y = bFilterYear.value, g = bFilterGenre.value;
      bFilterYear.innerHTML = '<option value="">전체</option>';
      years.forEach(v => bFilterYear.insertAdjacentHTML('beforeend', `<option value="${v}">${v}년</option>`));
      if (years.includes(y)) bFilterYear.value = y;
      bFilterGenre.innerHTML = '<option value="">전체</option>';
      genres.forEach(v => bFilterGenre.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
      if (genres.includes(g)) bFilterGenre.value = g;
    }
    function renderBooksList() {
      const books = loadData(BOOKS_KEY);
      updateBookFilters(books);
      if (!books.length) {
        bookTable.style.display = 'none';
        booksEmpty.style.display = 'block';
        booksEmpty.textContent = '아직 등록된 책이 없습니다.';
        bookListSummary.textContent = '';
        return;
      }
      let filtered = books.map((b, i) => ({ ...b, _index: i })).filter(item => {
        if (bFilterYear.value && (!item.finishDate || item.finishDate.slice(0,4) !== bFilterYear.value)) return false;
        if (bFilterTitle.value.trim() && !(item.title || '').toLowerCase().includes(bFilterTitle.value.trim().toLowerCase())) return false;
        if (bFilterAuthor.value.trim() && !(item.author || '').toLowerCase().includes(bFilterAuthor.value.trim().toLowerCase())) return false;
        if (bFilterGenre.value && (item.genre || '') !== bFilterGenre.value) return false;
        if (bFilterFormat.value && (item.format || '') !== bFilterFormat.value) return false;
        const hasMemo = !!(item.memo && item.memo.trim());
        if (bFilterMemo.value === 'with' && !hasMemo) return false;
        if (bFilterMemo.value === 'without' && hasMemo) return false;
        return true;
      });
      if (!filtered.length) {
        bookTable.style.display = 'none';
        booksEmpty.style.display = 'block';
        booksEmpty.textContent = '필터 조건에 맞는 책이 없습니다.';
        bookListSummary.textContent = `총 ${books.length}권 기록됨 (필터 결과 0권)`;
        return;
      }
      filtered.sort((a,b) => (b.finishDate || b.startDate || '').localeCompare(a.finishDate || a.startDate || ''));
      booksEmpty.style.display = 'none';
      bookTable.style.display = 'table';
      bookTbody.innerHTML = '';
      filtered.forEach(item => {
        const tr = document.createElement('tr');
        const days = calcDays(item.startDate, item.finishDate);
        tr.innerHTML = `
          <td class="book-col-title">
            <div style="cursor:pointer;" title="누르면 수정">${escapeHtml(item.title)}</div>
            ${item.author ? `<div class="small">${escapeHtml(item.author)}</div>` : ''}
            ${item.genre ? `<div class="small"><span class="tag">${escapeHtml(item.genre)}</span></div>` : ''}
          </td>
          <td class="book-col-date">${item.finishDate || item.startDate ? `<span class="book-date-line">${escapeHtml(item.finishDate || item.startDate)}</span><span class="book-date-line sub">${days ? `${days}일` : ''}</span>` : '<span class="small">날짜 없음</span>'}</td>
          <td class="center small book-col-type">${formatBookType(item.format)}</td>
          <td class="center book-col-memo"></td>`;
        tr.children[0].addEventListener('click', () => startBookEdit(item._index));
        const tdMemo = tr.querySelector('.book-col-memo');
        const memos = Array.isArray(item.memos) ? item.memos : [];
        const hasMemoArray = memos.some(m => m && m.trim());
        const hasLegacy = item.memo && item.memo.trim();
        const hasMemo = hasMemoArray || hasLegacy;
        const memoBtn = document.createElement('button');
        memoBtn.type = 'button';
        memoBtn.className = 'memo-btn ' + (hasMemo ? 'has-memo' : 'no-memo');
        memoBtn.textContent = '📝';
        memoBtn.title = hasMemo ? '메모 있음' : '메모 없음';
        memoBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          openMemoListScreen(item._index);
        });
        tdMemo.appendChild(memoBtn);
        bookTbody.appendChild(tr);
      });
      const finishedCount = books.filter(b => b.finishDate).length;
      bookListSummary.textContent = `총 ${books.length}권 기록됨 (완독 ${finishedCount}권, 필터 결과 ${filtered.length}권)`;
    }
    function renderBooksStats() {
      const books = loadData(BOOKS_KEY);
      const finished = books.filter(b => b.finishDate);
      const grid = document.getElementById('book-stats-grid');
      const currentYear = String(new Date().getFullYear());
      const years = finished.map(b => b.finishDate.slice(0,4)).filter(v => /^\d{4}$/.test(v));
      const thisYearCount = finished.filter(b => b.finishDate && b.finishDate.slice(0,4) === currentYear).length;
      let avgYear = 0;
      let avgMonth = 0;
      if (finished.length) {
        const sortedDates = finished.map(b => new Date(b.finishDate)).filter(d => !isNaN(d.getTime())).sort((a,b) => a - b);
        if (sortedDates.length) {
          const first = sortedDates[0];
          const last = sortedDates[sortedDates.length - 1];
          const yearSpan = Math.max(1, last.getFullYear() - first.getFullYear() + 1);
          const monthSpan = Math.max(1, (last.getFullYear() - first.getFullYear()) * 12 + (last.getMonth() - first.getMonth()) + 1);
          avgYear = finished.length / yearSpan;
          avgMonth = finished.length / monthSpan;
        }
      }
      grid.innerHTML = `
        <div class="stat-card"><div class="stat-label">전체 기록</div><div class="stat-value">${books.length}권</div></div>
        <div class="stat-card"><div class="stat-label">올해 독서량</div><div class="stat-value">${thisYearCount}권</div></div>
        <div class="stat-card"><div class="stat-label">연 평균 독서량</div><div class="stat-value">${avgYear ? avgYear.toFixed(1) + '권' : '-'}</div></div>
        <div class="stat-card"><div class="stat-label">월 평균 독서량</div><div class="stat-value">${avgMonth ? avgMonth.toFixed(1) + '권' : '-'}</div></div>`;
      const yearStats = {};
      finished.forEach(b => { const y = b.finishDate.slice(0,4); if (/^\d{4}$/.test(y)) yearStats[y] = (yearStats[y] || 0) + 1; });
      const yKeys = Object.keys(yearStats).sort((a,b)=>b.localeCompare(a));
      const bookYearTable = document.getElementById('book-year-table');
      const bookYearTbody = document.getElementById('book-year-tbody');
      const bookYearEmpty = document.getElementById('book-year-empty');
      bookYearTbody.innerHTML = '';
      if (!yKeys.length) { bookYearTable.style.display='none'; bookYearEmpty.style.display='block'; }
      else {
        bookYearTable.style.display='table'; bookYearEmpty.style.display='none';
        yKeys.forEach(y => bookYearTbody.insertAdjacentHTML('beforeend', `<tr><td>${y}년</td><td class="center">${yearStats[y]}권</td></tr>`));
      }
      const monthStats = {};
      finished.forEach(b => { const ym = b.finishDate.slice(0,7); if (/^\d{4}-\d{2}$/.test(ym)) monthStats[ym] = (monthStats[ym] || 0) + 1; });
      const mKeys = Object.keys(monthStats).sort((a,b)=>b.localeCompare(a));
      const bookMonthTable = document.getElementById('book-month-table');
      const bookMonthTbody = document.getElementById('book-month-tbody');
      const bookMonthEmpty = document.getElementById('book-month-empty');
      bookMonthTbody.innerHTML = '';
      if (!mKeys.length) { bookMonthTable.style.display='none'; bookMonthEmpty.style.display='block'; }
      else {
        bookMonthTable.style.display='table'; bookMonthEmpty.style.display='none';
        mKeys.forEach(ym => bookMonthTbody.insertAdjacentHTML('beforeend', `<tr><td>${ym}</td><td class="center">${monthStats[ym]}권</td></tr>`));
      }
    }

    const gameForm = document.getElementById('game-form');
    const gameTitle = document.getElementById('game-title');
    const gamePlatform = document.getElementById('game-platform');
    const gameStart = document.getElementById('game-start-date');
    const gameFinish = document.getElementById('game-finish-date');
    const gameStatus = document.getElementById('game-status');
    const gamePrice = document.getElementById('game-price');
    const gamePlaytime = document.getElementById('game-playtime');
    const gameNote = document.getElementById('game-note');
    const gameEditIndex = document.getElementById('game-edit-index');
    const gameSubmitBtn = document.getElementById('game-submit-btn');
    const gameResetBtn = document.getElementById('game-reset-btn');
    const gameDeleteBtn = document.getElementById('game-delete-btn');

    function clearGameForm() {
      gameForm.reset();
      gameEditIndex.value = '';
      gameStatus.value = '';
      gameSubmitBtn.textContent = '추가';
      gameResetBtn.style.display = 'none';
      gameDeleteBtn.style.display = 'none';
    }
    gameResetBtn.addEventListener('click', clearGameForm);
    gameDeleteBtn.addEventListener('click', () => {
      const idx = Number(gameEditIndex.value);
      if (!Number.isInteger(idx)) return;
      if (!confirm('이 게임 기록을 삭제할까?')) return;
      const games = loadData(GAMES_KEY);
      games.splice(idx, 1);
      saveData(GAMES_KEY, games);
      clearGameForm();
      renderGamesList();
      renderGamesStats();
      showToast('게임 기록이 삭제되었다.');
    });
    gameForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const title = gameTitle.value.trim();
      if (!title) return showToast('게임 이름은 필수 항목이다.');
      const games = loadData(GAMES_KEY);
      const item = {
        title,
        platform: gamePlatform.value.trim(),
        startDate: gameStart.value || '',
        finishDate: gameFinish.value || '',
        status: gameStatus.value || '',
        price: Number(gamePrice.value || 0),
        playTime: Number(gamePlaytime.value || 0),
        note: gameNote.value || ''
      };
      const edit = gameEditIndex.value;
      if (edit !== '') {
        games[Number(edit)] = item;
        showToast('게임 기록이 수정되었다.');
      } else {
        games.push(item);
        showToast('게임 기록이 추가되었다.');
      }
      saveData(GAMES_KEY, games);
      clearGameForm();
      renderGamesList();
      renderGamesStats();
    });
    function startGameEdit(index) {
      const games = loadData(GAMES_KEY);
      const item = games[index];
      if (!item) return;
      document.querySelector('.tab-btn[data-module="games-module"]').click();
      document.querySelector('#games-module .subtab-btn[data-target="games-input"]').click();
      gameTitle.value = item.title || '';
      gamePlatform.value = item.platform || '';
      gameStart.value = item.startDate || '';
      gameFinish.value = item.finishDate || '';
      gameStatus.value = item.status || '';
      gamePrice.value = item.price || '';
      gamePlaytime.value = item.playTime || '';
      gameNote.value = item.note || '';
      gameEditIndex.value = String(index);
      gameSubmitBtn.textContent = '수정 저장';
      gameResetBtn.style.display = 'inline-block';
      gameDeleteBtn.style.display = 'inline-block';
    }

    const gFilterTitle = document.getElementById('game-filter-title');
    const gFilterPlatform = document.getElementById('game-filter-platform');
    const gFilterStatus = document.getElementById('game-filter-status');
    const gFilterYear = document.getElementById('game-filter-year');
    const gFilterReset = document.getElementById('game-filter-reset-btn');
    const gameTable = document.getElementById('game-table');
    const gameTbody = document.getElementById('game-tbody');
    const gamesEmpty = document.getElementById('games-empty');
    const gameListSummary = document.getElementById('game-list-summary');

    [gFilterPlatform, gFilterStatus, gFilterYear].forEach(el => el.addEventListener('change', renderGamesList));
    gFilterTitle.addEventListener('input', renderGamesList);
    gFilterReset.addEventListener('click', () => {
      gFilterTitle.value = '';
      gFilterPlatform.value = '';
      gFilterStatus.value = '';
      gFilterYear.value = '';
      renderGamesList();
    });
    function updateGameFilters(games) {
      const years = [...new Set(games.filter(g => g.finishDate).map(g => g.finishDate.slice(0,4)).filter(v => /^\d{4}$/.test(v)))].sort((a,b) => b.localeCompare(a));
      const platforms = [...new Set(games.map(g => (g.platform || '').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b));
      const p = gFilterPlatform.value, y = gFilterYear.value;
      gFilterPlatform.innerHTML = '<option value="">전체</option>';
      platforms.forEach(v => gFilterPlatform.insertAdjacentHTML('beforeend', `<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`));
      if (platforms.includes(p)) gFilterPlatform.value = p;
      gFilterYear.innerHTML = '<option value="">전체</option>';
      years.forEach(v => gFilterYear.insertAdjacentHTML('beforeend', `<option value="${v}">${v}년</option>`));
      if (years.includes(y)) gFilterYear.value = y;
    }
    function renderGamesList() {
      const games = loadData(GAMES_KEY);
      updateGameFilters(games);
      if (!games.length) {
        gameTable.style.display = 'none';
        gamesEmpty.style.display = 'block';
        gamesEmpty.textContent = '아직 등록된 게임이 없습니다.';
        gameListSummary.textContent = '';
        return;
      }
      let filtered = games.map((g, i) => ({ ...g, _index: i })).filter(item => {
        if (gFilterTitle.value.trim() && !(item.title || '').toLowerCase().includes(gFilterTitle.value.trim().toLowerCase())) return false;
        if (gFilterPlatform.value && (item.platform || '') !== gFilterPlatform.value) return false;
        if (gFilterStatus.value && (item.status || '') !== gFilterStatus.value) return false;
        if (gFilterYear.value && (!item.finishDate || item.finishDate.slice(0,4) !== gFilterYear.value)) return false;
        return true;
      });
      if (!filtered.length) {
        gameTable.style.display = 'none';
        gamesEmpty.style.display = 'block';
        gamesEmpty.textContent = '필터 조건에 맞는 게임이 없습니다.';
        gameListSummary.textContent = `총 ${games.length}개 기록됨 (필터 결과 0개)`;
        return;
      }
      filtered.sort((a,b) => (b.finishDate || b.startDate || '').localeCompare(a.finishDate || a.startDate || ''));
      gamesEmpty.style.display = 'none';
      gameTable.style.display = 'table';
      gameTbody.innerHTML = '';
      filtered.forEach(item => {
        const days = calcDays(item.startDate, item.finishDate);
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td>
            <div style="cursor:pointer;" title="누르면 수정">${escapeHtml(item.title)}</div>
            ${item.platform ? `<div class="small"><span class="tag">${escapeHtml(item.platform)}</span>${item.playTime ? `<span class="tag">${item.playTime}시간</span>` : ''}</div>` : item.playTime ? `<div class="small"><span class="tag">${item.playTime}시간</span></div>` : ''}
            ${item.note ? `<div class="small">메모 있음</div>` : ''}
          </td>
          <td>${item.finishDate || item.startDate || '<span class="small">날짜 없음</span>'}${days ? `<div class="small">${days}일</div>` : ''}</td>
          <td class="center small">${formatGameStatus(item.status)}</td>
          <td class="center small">${formatPrice(item.price)}</td>`;
        tr.children[0].addEventListener('click', () => startGameEdit(item._index));
        gameTbody.appendChild(tr);
      });
      const completedCount = games.filter(g => g.status === 'completed' || g.finishDate).length;
      gameListSummary.textContent = `총 ${games.length}개 기록됨 (완료 ${completedCount}개, 필터 결과 ${filtered.length}개)`;
    }
    function renderGamesStats() {
      const games = loadData(GAMES_KEY);
      const completed = games.filter(g => g.status === 'completed' || g.finishDate);
      const thisYear = String(new Date().getFullYear());
      const thisYearCompleted = completed.filter(g => g.finishDate && g.finishDate.slice(0,4) === thisYear).length;
      const totalPrice = games.reduce((sum, g) => sum + Number(g.price || 0), 0);
      const grid = document.getElementById('game-stats-grid');
      grid.innerHTML = `
        <div class="stat-card"><div class="stat-label">전체 기록</div><div class="stat-value">${games.length}개</div></div>
        <div class="stat-card"><div class="stat-label">완료 수</div><div class="stat-value">${completed.length}개</div></div>
        <div class="stat-card"><div class="stat-label">올해 완료</div><div class="stat-value">${thisYearCompleted}개</div></div>
        <div class="stat-card"><div class="stat-label">총 사용 금액</div><div class="stat-value">${totalPrice ? totalPrice.toLocaleString('ko-KR') + '원' : '-'}</div></div>`;

      const yearStats = {};
      completed.forEach(g => {
        const y = (g.finishDate || '').slice(0,4);
        if (/^\d{4}$/.test(y)) yearStats[y] = (yearStats[y] || 0) + 1;
      });
      const yKeys = Object.keys(yearStats).sort((a,b)=>b.localeCompare(a));
      const gameYearTable = document.getElementById('game-year-table');
      const gameYearTbody = document.getElementById('game-year-tbody');
      const gameYearEmpty = document.getElementById('game-year-empty');
      gameYearTbody.innerHTML = '';
      if (!yKeys.length) { gameYearTable.style.display='none'; gameYearEmpty.style.display='block'; }
      else {
        gameYearTable.style.display='table'; gameYearEmpty.style.display='none';
        yKeys.forEach(y => gameYearTbody.insertAdjacentHTML('beforeend', `<tr><td>${y}년</td><td class="center">${yearStats[y]}개</td></tr>`));
      }

      const platformStats = {};
      games.forEach(g => {
        const p = (g.platform || '미입력').trim() || '미입력';
        platformStats[p] = (platformStats[p] || 0) + 1;
      });
      const pKeys = Object.keys(platformStats).sort((a,b)=>platformStats[b]-platformStats[a] || a.localeCompare(b));
      const gamePlatformTable = document.getElementById('game-platform-table');
      const gamePlatformTbody = document.getElementById('game-platform-tbody');
      const gamePlatformEmpty = document.getElementById('game-platform-empty');
      gamePlatformTbody.innerHTML = '';
      if (!pKeys.length) { gamePlatformTable.style.display='none'; gamePlatformEmpty.style.display='block'; }
      else {
        gamePlatformTable.style.display='table'; gamePlatformEmpty.style.display='none';
        pKeys.forEach(p => gamePlatformTbody.insertAdjacentHTML('beforeend', `<tr><td>${escapeHtml(p)}</td><td class="center">${platformStats[p]}개</td></tr>`));
      }
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeMemoScreens();
    });

    window.addEventListener('load', () => {
      clearGameForm();
      renderBooksList();
      renderBooksStats();
      renderGamesList();
      renderGamesStats();
    });
  </script>
</body>
</html>
